services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      STORAGE_DIR: /data/storage
    volumes:
      - ./storage:/data/storage
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 20s
      timeout: 5s
      retries: 10

  frontend:
    build: ./frontend
    ports:
      - "${DEVBOARD_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
